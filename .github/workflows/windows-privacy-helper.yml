name: Windows native privacy helper
on:
  push:
    paths: ['.github/workflows/windows-privacy-helper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_privacy:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - name: Compile and verify native private-file protection
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'poxey-native-privacy'
          New-Item -ItemType Directory -Force $dir|Out-Null
          $source=@'
          // PoxeyX1 private-file ACL helper. Current user only; never requests elevation.
          // Build with MSVC /MT. No PowerShell, .NET, network, logging or user interface.
          #define UNICODE
          #define _UNICODE
          #include <windows.h>
          #include <aclapi.h>
          #include <wchar.h>
          
          static DWORD protect_file(const wchar_t *name) {
              HANDLE file=INVALID_HANDLE_VALUE, token=NULL;
              TOKEN_USER *user=NULL;
              PACL requested=NULL, actual=NULL;
              PSECURITY_DESCRIPTOR descriptor=NULL;
              PSID owner=NULL;
              DWORD system_sid[SECURITY_MAX_SID_SIZE/sizeof(DWORD)], admin_sid[SECURITY_MAX_SID_SIZE/sizeof(DWORD)];
              DWORD size=0, system_size=sizeof(system_sid), admin_size=sizeof(admin_sid);
              DWORD result=ERROR_ACCESS_DENIED, revision=0;
              SECURITY_DESCRIPTOR_CONTROL control=0;
              EXPLICIT_ACCESSW entries[3];
              BY_HANDLE_FILE_INFORMATION info;
              ACL_SIZE_INFORMATION acl_info;
              BOOL seen[3]={FALSE,FALSE,FALSE};
              PSID allowed[3];
              if(wcslen(name)<4 || name[1]!=L':' || name[2]!=L'\\') return ERROR_INVALID_NAME;
              // Opening the reparse point itself, without delete sharing, prevents a
              // path replacement between validation and the handle-based ACL update.
              file=CreateFileW(name,FILE_READ_ATTRIBUTES|READ_CONTROL|WRITE_DAC|WRITE_OWNER,
                              FILE_SHARE_READ|FILE_SHARE_WRITE,NULL,OPEN_EXISTING,
                              FILE_FLAG_OPEN_REPARSE_POINT,NULL);
              if(file==INVALID_HANDLE_VALUE) return GetLastError();
              if(!GetFileInformationByHandle(file,&info)) {result=GetLastError();goto done;}
              if((info.dwFileAttributes&(FILE_ATTRIBUTE_REPARSE_POINT|FILE_ATTRIBUTE_DIRECTORY)) || info.nNumberOfLinks!=1) goto done;
              if(!OpenProcessToken(GetCurrentProcess(),TOKEN_QUERY,&token)) {result=GetLastError();goto done;}
              GetTokenInformation(token,TokenUser,NULL,0,&size);
              user=(TOKEN_USER*)LocalAlloc(LPTR,size);
              if(!user) {result=ERROR_NOT_ENOUGH_MEMORY;goto done;}
              if(!GetTokenInformation(token,TokenUser,user,size,&size) ||
                 !CreateWellKnownSid(WinLocalSystemSid,NULL,system_sid,&system_size) ||
                 !CreateWellKnownSid(WinBuiltinAdministratorsSid,NULL,admin_sid,&admin_size)) {result=GetLastError();goto done;}
              allowed[0]=user->User.Sid;allowed[1]=(PSID)system_sid;allowed[2]=(PSID)admin_sid;
              ZeroMemory(entries,sizeof(entries));
              for(DWORD i=0;i<3;i++) {
                  entries[i].grfAccessPermissions=FILE_ALL_ACCESS;
                  entries[i].grfAccessMode=GRANT_ACCESS;
                  entries[i].grfInheritance=NO_INHERITANCE;
                  entries[i].Trustee.TrusteeForm=TRUSTEE_IS_SID;
                  entries[i].Trustee.ptstrName=(LPWSTR)allowed[i];
              }
              result=SetEntriesInAclW(3,entries,NULL,&requested);
              if(result!=ERROR_SUCCESS) goto done;
              result=SetSecurityInfo(file,SE_FILE_OBJECT,OWNER_SECURITY_INFORMATION|DACL_SECURITY_INFORMATION|PROTECTED_DACL_SECURITY_INFORMATION,user->User.Sid,NULL,requested,NULL);
              if(result!=ERROR_SUCCESS) goto done;
              result=GetSecurityInfo(file,SE_FILE_OBJECT,OWNER_SECURITY_INFORMATION|DACL_SECURITY_INFORMATION,&owner,NULL,&actual,NULL,&descriptor);
              if(result!=ERROR_SUCCESS) goto done;
              result=ERROR_ACCESS_DENIED;
              if(!owner || !EqualSid(owner,user->User.Sid) || !actual ||
                 !GetSecurityDescriptorControl(descriptor,&control,&revision) || !(control&SE_DACL_PROTECTED) ||
                 !GetAclInformation(actual,&acl_info,sizeof(acl_info),AclSizeInformation) || acl_info.AceCount!=3) goto done;
              for(DWORD i=0;i<acl_info.AceCount;i++) {
                  ACCESS_ALLOWED_ACE *ace=NULL;BOOL matched=FALSE;
                  if(!GetAce(actual,i,(LPVOID*)&ace) || ace->Header.AceType!=ACCESS_ALLOWED_ACE_TYPE ||
                     ace->Header.AceFlags!=0 || ace->Mask!=FILE_ALL_ACCESS || !IsValidSid(&ace->SidStart)) goto done;
                  for(DWORD j=0;j<3;j++) if(EqualSid(&ace->SidStart,allowed[j])) {
                      if(seen[j]) goto done;
                      seen[j]=TRUE;matched=TRUE;break;
                  }
                  if(!matched) goto done;
              }
              if(seen[0]&&seen[1]&&seen[2]) result=ERROR_SUCCESS;
          done:
              if(descriptor) LocalFree(descriptor);
              if(requested) LocalFree(requested);
              if(user) LocalFree(user);
              if(token) CloseHandle(token);
              if(file!=INVALID_HANDLE_VALUE) CloseHandle(file);
              return result;
          }
          int wmain(int argc,wchar_t **argv) {
              if(argc!=2) return ERROR_INVALID_PARAMETER;
              return (int)protect_file(argv[1]);
          }
          '@
          Set-Content -LiteralPath "$dir\private-storage.c" -Value $source -Encoding UTF8
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(!$vs){throw 'The official Windows runner has no MSVC toolchain'}
          $vc=Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $command="`"$vc`" && cl /nologo /W4 /O2 /MT `"$dir\private-storage.c`" /Fe:`"$dir\PoxeyPrivateStorage.exe`" /Fo:`"$dir\private-storage.obj`" /link advapi32.lib"
          & $env:COMSPEC /d /c $command
          if($LASTEXITCODE -ne 0){throw 'Native privacy helper compilation failed'}
          $file=Join-Path $dir 'dummy-private.json'
          Set-Content -LiteralPath $file -Value 'Non-sensitive native privacy test fixture.'
          icacls $file /grant '*S-1-1-0:(R)'|Out-Null
          & "$dir\PoxeyPrivateStorage.exe" $file
          if($LASTEXITCODE -ne 0){throw "Native ACL protection failed: $LASTEXITCODE"}
          $acl=Get-Acl -LiteralPath $file
          $sid=[Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $allowed=@($sid,'S-1-5-18','S-1-5-32-544')
          if(!$acl.AreAccessRulesProtected -or $acl.Owner -ne [Security.Principal.WindowsIdentity]::GetCurrent().Name){throw 'Native owner or inheritance check failed'}
          foreach($a in $acl.Access){if($a.IsInherited -or $a.AccessControlType -ne 'Allow' -or $a.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value -notin $allowed){throw 'Native private ACL admitted an unexpected principal'}}
          if($acl.Access.Count -ne 3){throw 'Native private ACL must contain exactly three allow rules'}
          & "$dir\PoxeyPrivateStorage.exe" $dir
          if($LASTEXITCODE -eq 0){throw 'Native helper accepted a directory'}
          $link=Join-Path $dir 'dummy-link.json'
          New-Item -ItemType SymbolicLink -Path $link -Target $file|Out-Null
          & "$dir\PoxeyPrivateStorage.exe" $link
          if($LASTEXITCODE -eq 0){throw 'Native helper accepted a symbolic link'}
          $hard=Join-Path $dir 'dummy-hardlink.json'
          New-Item -ItemType HardLink -Path $hard -Target $file|Out-Null
          & "$dir\PoxeyPrivateStorage.exe" $hard
          if($LASTEXITCODE -eq 0){throw 'Native helper accepted a hard-linked private file'}
          $result=@{nativeProtection=$true;exactOwnerAndACL=$true;unexpectedPrincipalRemoved=$true;inheritanceDisabled=$true;directoryRejected=$true;symlinkRejected=$true;hardlinkRejected=$true;sha256=(Get-FileHash "$dir\PoxeyPrivateStorage.exe" -Algorithm SHA256).Hash.ToLower();architecture='x64';runtime='Static CRT; no PowerShell or .NET required by helper'}
          $result|ConvertTo-Json|Set-Content "$dir\native-results.json"
          $result|ConvertTo-Json|Write-Host
      - name: Keep native binary and security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poxey-native-privacy
          path: |
            ${{ runner.temp }}/poxey-native-privacy/PoxeyPrivateStorage.exe
            ${{ runner.temp }}/poxey-native-privacy/native-results.json
          retention-days: 7
