name: Windows beta startup verification
on:
  push:
    paths: ['.github/workflows/windows-startup.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-startup
  cancel-in-progress: false
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      POXEY_TEST_RUNNER: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Download checksum-verified beta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\poxey-evidence" -Force | Out-Null
          $url='https://poxeyx1-private-admin.6sk6r6gbpz.workers.dev/download/windows-26.2.2'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\PoxeySetup.exe" -TimeoutSec 90
          $hash=(Get-FileHash "$env:RUNNER_TEMP\PoxeySetup.exe" -Algorithm SHA256).Hash.ToLower()
          if($hash -ne 'e0f26524b47b470cf8ee6575aff18b2de922d6e00a5e7f13663593822dbade92'){throw 'Unexpected installer hash'}
          Write-Host 'Installer integrity passed. No provider credentials or security-policy changes.'
      - name: Install and verify the real Windows renderer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $evidence="$env:RUNNER_TEMP\poxey-evidence"
          $report=[ordered]@{testedAt=[DateTime]::UtcNow.ToString('o');os=[Environment]::OSVersion.VersionString;platformCoverage=$env:POXEY_TEST_RUNNER;osArchitecture=[Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString();browserBinaryArchitecture='x64';passed=$false}
          $started=Get-Date
          $app=$null
          try {
            $env:POXEY_DIAGNOSTIC='1'
            $env:POXEY_TEST_PROFILE="$env:RUNNER_TEMP\poxey-empty-qa-profile"
            $env:POXEY_ARCADE_EVIDENCE_DIR=$evidence
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
            $installer=Start-Process "$env:RUNNER_TEMP\PoxeySetup.exe" -ArgumentList '/S','--force-run' -PassThru
            if(!$installer.WaitForExit(90000)){throw 'Installer timed out'}
            $report.installerExitCode=$installer.ExitCode
            if($installer.ExitCode -ne 0){throw "Installer failed: $($installer.ExitCode)"}
            $folders=@("$env:LOCALAPPDATA\Programs\poxeyx1-consumer-beta","$env:LOCALAPPDATA\Programs\PoxeyX1 Consumer Beta")
            $folder=$folders|Where-Object {Test-Path -LiteralPath "$_\PoxeyX1.exe"}|Select-Object -First 1
            if(!$folder){throw 'No per-user installed executable'}
            $automatic=$null
            for($launch=0;$launch -lt 20;$launch++) {
              $automatic=Get-Process -Name PoxeyX1 -ErrorAction SilentlyContinue|Where-Object {$_.Path -eq "$folder\PoxeyX1.exe" -and $_.MainWindowHandle -ne 0}|Select-Object -First 1
              if($automatic){break}
              Start-Sleep -Seconds 1
            }
            if(!$automatic){throw 'The installer launch-after-finish path did not open a visible browser window'}
            $report.launchAfterInstall=$true
            $report.installerUIAutomation='Silent install plus the maintained --force-run launch path; the informational beta notice is skipped for automation'
            if(!$automatic.CloseMainWindow() -or !$automatic.WaitForExit(15000)){throw 'The automatically launched browser did not quit normally'}
            $report.installedFolderLeaf=Split-Path $folder -Leaf
            $report.exeVersion=(Get-Item "$folder\PoxeyX1.exe").VersionInfo.FileVersion
            $report.exeSignature=[string](Get-AuthenticodeSignature "$folder\PoxeyX1.exe").Status
            $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
            $principal=[Security.Principal.WindowsPrincipal]::new($identity)
            $report.runnerIsAdministrator=$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            $report.standardUserInstallVerified=$false
            $env:POXEY_DIAGNOSTIC='1'
            $env:POXEY_TEST_PROFILE="$env:RUNNER_TEMP\poxey-empty-qa-profile"
            $env:POXEY_ARCADE_EVIDENCE_DIR=$evidence
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
            $app=Start-Process "$folder\PoxeyX1.exe" -ArgumentList '--remote-debugging-port=9223','--remote-debugging-address=127.0.0.1','--enable-logging',"--log-file=$evidence\chromium.log" -PassThru -RedirectStandardError "$evidence\stderr.txt" -RedirectStandardOutput "$evidence\stdout.txt"
            $report.startupPID=$app.Id
            $target=$null
            for($i=0;$i -lt 30;$i++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if($app.HasExited){$report.appExitCode=$app.ExitCode;throw "Browser exited during startup: $($app.ExitCode)"}
              try {foreach($candidate in (Invoke-RestMethod 'http://127.0.0.1:9223/json/list' -TimeoutSec 1)){if($candidate.type -eq 'page' -and $candidate.url -match '^file:.*[/\\]index\.html'){$target=$candidate;break}}}catch{}
              if($target){break}
            }
            if(!$target){throw 'No actual browser shell renderer appeared within 30 seconds'}
            $report.rendererStartedAfterSeconds=[math]::Round(((Get-Date)-$started).TotalSeconds,2)
            $ws=[Net.WebSockets.ClientWebSocket]::new()
            $timeout=[Threading.CancellationTokenSource]::new(60000)
            try {
              $ws.ConnectAsync([uri]$target.webSocketDebuggerUrl,$timeout.Token).GetAwaiter().GetResult()|Out-Null
              function Send-CDP($id,$method,$parameters) {
                $bytes=[Text.Encoding]::UTF8.GetBytes((@{id=$id;method=$method;params=$parameters}|ConvertTo-Json -Depth 10 -Compress))
                $ws.SendAsync([ArraySegment[byte]]::new($bytes),[Net.WebSockets.WebSocketMessageType]::Text,$true,$timeout.Token).GetAwaiter().GetResult()|Out-Null
                do {
                  $stream=[IO.MemoryStream]::new()
                  do {$buffer=[byte[]]::new(65536);$part=$ws.ReceiveAsync([ArraySegment[byte]]::new($buffer),$timeout.Token).GetAwaiter().GetResult();$stream.Write($buffer,0,$part.Count);if($stream.Length -gt 15000000){throw 'Oversized diagnostic response'}}while(!$part.EndOfMessage)
                  $message=[Text.Encoding]::UTF8.GetString($stream.ToArray())|ConvertFrom-Json
                  $stream.Dispose()
                }while($message.id -ne $id)
                if($message.error){throw "CDP failed: $($message.error.message)"}
                return $message.result
              }
              Start-Sleep -Seconds 3
              $state=Send-CDP 1 'Runtime.evaluate' @{expression='JSON.stringify({title:document.title,readyState:document.readyState,textLength:document.body?.innerText?.length||0,buttonCount:document.querySelectorAll("button").length,bodyDisplay:getComputedStyle(document.body).display,bodyVisibility:getComputedStyle(document.body).visibility,bodyClass:document.body.className,bodyRect:{width:document.body.getBoundingClientRect().width,height:document.body.getBoundingClientRect().height},textContentLength:document.body?.textContent?.length||0})';returnByValue=$true}
              $report.rendererState=$state.result.value|ConvertFrom-Json
              $shot=Send-CDP 2 'Page.captureScreenshot' @{format='png'}
              [IO.File]::WriteAllBytes("$evidence\windows-onboarding.png",[Convert]::FromBase64String($shot.data))
              $setup=Send-CDP 3 'Runtime.evaluate' @{expression='JSON.stringify({present:!!document.getElementById("installed-setup"),ready:document.getElementById("installed-setup")?.contentDocument?.readyState,heading:document.getElementById("installed-setup")?.contentDocument?.getElementById("heading")?.textContent})';returnByValue=$true}
              $report.onboardingInitial=$setup.result.value|ConvertFrom-Json
              if($report.onboardingInitial.present) {
                if($report.onboardingInitial.ready -ne 'complete' -or !$report.onboardingInitial.heading){throw 'First-run onboarding did not render'}
                $report.onboardingSteps=@()
                for($step=0;$step -lt 10;$step++) {
                  $progress=Send-CDP (10+$step) 'Runtime.evaluate' @{expression='(()=>{const d=document.getElementById("installed-setup")?.contentDocument;const n=d?.getElementById("next");const result={progress:d?.getElementById("progressText")?.textContent,heading:d?.getElementById("heading")?.textContent,clicked:!!n&&!n.disabled};if(result.clicked)n.click();return JSON.stringify(result)})()';returnByValue=$true}
                  $stepResult=$progress.result.value|ConvertFrom-Json
                  $report.onboardingSteps+=,$stepResult
                  if(!$stepResult.clicked -or !$stepResult.heading){throw "Onboarding step $step could not advance"}
                  Start-Sleep -Milliseconds 150
                }
                Start-Sleep -Seconds 3
              }
              $state=Send-CDP 30 'Runtime.evaluate' @{expression='JSON.stringify({title:document.title,readyState:document.readyState,textLength:document.body?.innerText?.length||0,buttonCount:document.querySelectorAll("button").length,onboardingRemaining:!!document.getElementById("installed-setup"),onboardingSaved:localStorage.getItem("poxey-v2:onboarded")||localStorage.getItem("poxey:onboarded")})';returnByValue=$true}
              $report.rendererState=$state.result.value|ConvertFrom-Json
              $shot=Send-CDP 31 'Page.captureScreenshot' @{format='png'}
              [IO.File]::WriteAllBytes("$evidence\windows-browser.png",[Convert]::FromBase64String($shot.data))
              if($report.rendererState.readyState -ne 'complete' -or $report.rendererState.textLength -lt 80 -or $report.rendererState.buttonCount -lt 1 -or $report.rendererState.onboardingRemaining){throw 'Browser interface did not render after onboarding'}
              Send-CDP 32 'Runtime.evaluate' @{expression='document.getElementById("address").value="https://example.com";document.getElementById("address").focus()'}|Out-Null
              Send-CDP 33 'Input.dispatchKeyEvent' @{type='keyDown';key='Enter';code='Enter';windowsVirtualKeyCode=13;nativeVirtualKeyCode=13}|Out-Null
              Send-CDP 34 'Input.dispatchKeyEvent' @{type='keyUp';key='Enter';code='Enter';windowsVirtualKeyCode=13;nativeVirtualKeyCode=13}|Out-Null
              $page=$null
              for($load=0;$load -lt 12;$load++) {
                Start-Sleep -Seconds 1
                $visit=Send-CDP (40+$load) 'Runtime.evaluate' @{expression='JSON.stringify(Array.from(document.querySelectorAll("webview")).map(w=>{try{return {url:w.getURL(),title:w.getTitle()}}catch{return {}}}))';returnByValue=$true}
                foreach($item in ($visit.result.value|ConvertFrom-Json)){if($item.url -match '^https://example\.com/?$' -and $item.title -eq 'Example Domain'){$page=$item;break}}
                if($page){break}
              }
              if(!$page){throw 'The actual browser did not load the public Example Domain test page'}
              $report.publicWebpage=$page
              $shot=Send-CDP 60 'Page.captureScreenshot' @{format='png'}
              [IO.File]::WriteAllBytes("$evidence\windows-browsing.png",[Convert]::FromBase64String($shot.data))
              $report.windowHandle=[string]$app.MainWindowHandle
              $report.workingSetMiB=[math]::Round($app.WorkingSet64/1MB,1)
              $report.passed=$true
            }finally{$ws.Dispose();$timeout.Dispose()}
          }catch{$report.failure=$_.Exception.Message;Write-Host "Startup verification failed: $($report.failure)"}
          finally {
            if($app -and !$app.HasExited){Stop-Process -Id $app.Id -ErrorAction SilentlyContinue}
            $events=Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=$started} -ErrorAction SilentlyContinue|Where-Object {$_.ProviderName -in @('Application Error','Windows Error Reporting','SideBySide') -and $_.Message -match '(PoxeyX1|PoxeySetup)\.exe'}|Select-Object -First 5
            $events|ForEach-Object {$_.Message}|Set-Content "$evidence\application-events.txt"
            foreach($log in Get-ChildItem $evidence -File|Where-Object {$_.Extension -in @('.txt','.log','.jsonl')}) {
              $text=[IO.File]::ReadAllText($log.FullName)
              $text=$text.Replace($env:USERPROFILE,'[QA_PROFILE]').Replace($env:RUNNER_TEMP,'[QA_TEMP]')
              $text=$text -replace '(?i)(Bearer\s+)[A-Za-z0-9._-]+','$1[REDACTED]' -replace 'gsk_[A-Za-z0-9]+','[REDACTED]' -replace 'AIza[A-Za-z0-9_-]+','[REDACTED]'
              [IO.File]::WriteAllText($log.FullName,$text.Substring(0,[math]::Min($text.Length,100000)))
            }
            $report|ConvertTo-Json -Depth 10|Set-Content "$evidence\result.json"
            $report|ConvertTo-Json -Depth 10|Write-Host
          }
          if(!$report.passed){throw 'Windows startup acceptance failed; inspect the retained evidence'}
      - name: Retain real Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poxey-windows-startup-${{ matrix.os }}-${{ github.run_number }}
          path: ${{ runner.temp }}/poxey-evidence/
          retention-days: 7
          if-no-files-found: warn
  standard_user:
    runs-on: windows-11-arm
    timeout-minutes: 8
    steps:
      - name: Verify install, launch, upgrade and uninstall with administrator access removed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'Poxey-Standard-QA'
          New-Item -ItemType Directory -Path $dir -Force|Out-Null
          $url='https://poxeyx1-private-admin.6sk6r6gbpz.workers.dev/download/windows-26.2.2'
          Invoke-WebRequest $url -OutFile "$dir\PoxeySetup.exe" -TimeoutSec 90
          if((Get-FileHash "$dir\PoxeySetup.exe" -Algorithm SHA256).Hash.ToLower() -ne 'e0f26524b47b470cf8ee6575aff18b2de922d6e00a5e7f13663593822dbade92'){throw 'Unexpected installer hash'}
          $source=@'
          param([Parameter(Mandatory=$true)][string]$Installer,[Parameter(Mandatory=$true)][string]$OutputDirectory)
          $ErrorActionPreference='Stop'
          $result=[ordered]@{passed=$false;coverage='Windows 11 Arm, existing QA profile with restricted token: Administrators denied and privileges removed; x64 app under emulation, not a fresh-account or native x64 hardware test'}
          function Set-Stage([string]$Stage) {
            $result.stage=$Stage
            $result|ConvertTo-Json -Depth 5|Set-Content -LiteralPath "$OutputDirectory\standard-user-progress.json"
          }
          Set-Stage 'script-started'

          try {
            $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
            $principal=[Security.Principal.WindowsPrincipal]::new($identity)
            $result.isAdministrator=$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            if($result.isAdministrator){throw 'The test must actually run without administrator membership'}
            Set-Stage 'initializing-disposable-user-profile'
            $env:USERPROFILE=[Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile,[Environment+SpecialFolderOption]::Create)
            $env:LOCALAPPDATA=[Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData,[Environment+SpecialFolderOption]::Create)
            $env:APPDATA=[Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData,[Environment+SpecialFolderOption]::Create)
            if(!$env:USERPROFILE -or !$env:LOCALAPPDATA -or !$env:APPDATA -or !$env:LOCALAPPDATA.StartsWith($env:USERPROFILE,[StringComparison]::OrdinalIgnoreCase)){throw 'Own local profile unavailable'}
            function Run-Installer {
              $p=Start-Process -FilePath $Installer -ArgumentList '/S' -PassThru
              if(!$p.WaitForExit(90000)){throw 'Standard-user installer timed out'}
              if($p.ExitCode -ne 0){throw "Standard-user installer exit $($p.ExitCode)"}
            }
            Set-Stage 'first-install'
            Run-Installer
            $folder=Join-Path $env:LOCALAPPDATA 'Programs\PoxeyX1 Consumer Beta'
            $exe=Join-Path $folder 'PoxeyX1.exe'
            if(!(Test-Path -LiteralPath $exe)){throw 'The standard-user installation was not created in its own profile'}
            $result.perUserInstall=$true
            Set-Stage 'current-user-registration'
            $registration=@(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'|Where-Object {$_.DisplayName -like '*PoxeyX1*' -and $_.DisplayVersion -like '26.2.2*'})
            if($registration.Count -ne 1 -or $registration[0].InstallLocation.TrimEnd('\') -ne $folder){throw 'Incorrect current-user uninstall registration'}
            $result.currentUserRegistration=$true
            $profile=Join-Path $env:APPDATA 'PoxeyX1-Consumer-Beta'
            New-Item -ItemType Directory $profile -Force|Out-Null
            $marker=Join-Path $profile 'qa-preserve.txt'
            Set-Content -LiteralPath $marker -Value 'Owned temporary QA data; preserve during upgrade and uninstall.'
            $env:POXEY_DIAGNOSTIC='1'
            $env:POXEY_TEST_PROFILE=Join-Path $env:LOCALAPPDATA 'PoxeyX1-Scope-QA'
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
            Set-Stage 'browser-launch'
            $app=Start-Process $exe -ArgumentList '--remote-debugging-port=9224','--remote-debugging-address=127.0.0.1' -PassThru -RedirectStandardError "$OutputDirectory\standard-stderr.txt" -RedirectStandardOutput "$OutputDirectory\standard-stdout.txt"
            try {
              $renderer=$null
              for($i=0;$i -lt 25;$i++) {
                Start-Sleep -Seconds 1
                $app.Refresh()
                if($app.HasExited){throw "Standard-user browser exited: $($app.ExitCode)"}
                try {foreach($target in (Invoke-RestMethod 'http://127.0.0.1:9224/json/list' -TimeoutSec 1)){if($target.type -eq 'page' -and $target.url -match '^file:.*[/\\]index\.html'){$renderer=$target;break}}}catch{}
                if($renderer){break}
              }
              if(!$renderer){throw 'The standard-user browser did not create its shell renderer'}
              $result.standardUserRenderer=$true
            }finally{if(!$app.HasExited){Stop-Process -Id $app.Id -ErrorAction SilentlyContinue}}
            Start-Sleep -Seconds 2
            Set-Stage 'same-version-upgrade'
            Run-Installer
            if(!(Test-Path -LiteralPath $marker) -or !(Test-Path -LiteralPath $exe)){throw 'Upgrade lost QA profile or executable'}
            $result.upgradePreservedProfile=$true
            $desktop=[Environment]::GetFolderPath('Desktop')
            $startMenu=Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
            $links=@(Get-ChildItem $desktop,$startMenu -Filter '*PoxeyX1*.lnk' -Recurse -ErrorAction SilentlyContinue)
            if(!$links.Count){throw 'No Start menu or Desktop shortcut'}
            $shell=New-Object -ComObject WScript.Shell
            $valid=@($links|Where-Object {$shell.CreateShortcut($_.FullName).TargetPath -eq $exe})
            if(!$valid.Count){throw 'Shortcut target does not match installed executable'}
            $result.shortcutTargetsCorrect=$true
            Set-Stage 'uninstall'
            $uninstaller=Get-ChildItem $folder -Filter '*Uninstall*.exe'|Select-Object -First 1
            if(!$uninstaller){throw 'Uninstaller missing'}
            $p=Start-Process $uninstaller.FullName -ArgumentList '/S' -PassThru
            if(!$p.WaitForExit(60000)){throw 'Standard-user uninstall timed out'}
            if($p.ExitCode -ne 0){throw "Uninstaller exit $($p.ExitCode)"}
            for($i=0;$i -lt 25 -and (Test-Path -LiteralPath $exe);$i++){Start-Sleep -Seconds 1}
            if(Test-Path -LiteralPath $exe){throw 'Uninstall left installed executable behind'}
            if(!(Test-Path -LiteralPath $marker)){throw 'Uninstall deleted the QA profile'}
            $result.standardUserUninstall=$true
            $result.uninstallPreservedProfile=$true
            $result.passed=$true
          }catch{$result.failure=$_.Exception.Message;$result.failureLine=$_.InvocationInfo.ScriptLineNumber;$result.failureLocation=$_.InvocationInfo.PositionMessage}
          $result|ConvertTo-Json -Depth 5|Set-Content -LiteralPath "$OutputDirectory\standard-user-result.json"
          $result|ConvertTo-Json -Depth 5|Write-Host
          if(!$result.passed){exit 1}

          '@
          Set-Content "$dir\standard-user.ps1" -Value $source
          $runner=@'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class PoxeyRestrictedRunner {
            [StructLayout(LayoutKind.Sequential)] struct SidAttribute { public IntPtr Sid; public uint Attributes; }
            [StructLayout(LayoutKind.Sequential,CharSet=CharSet.Unicode)] struct StartupInfo {
              public int cb; public string reserved,desktop,title; public int x,y,xSize,ySize,xChars,yChars,fill,flags;
              public short show,reservedSize; public IntPtr reservedBytes,stdInput,stdOutput,stdError;
            }
            [StructLayout(LayoutKind.Sequential)] struct ProcessInfo { public IntPtr process,thread; public uint processId,threadId; }
            [DllImport("kernel32.dll")] static extern IntPtr GetCurrentProcess();
            [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr handle);
            [DllImport("kernel32.dll")] static extern IntPtr LocalFree(IntPtr value);
            [DllImport("kernel32.dll")] static extern uint WaitForSingleObject(IntPtr handle,uint milliseconds);
            [DllImport("kernel32.dll",SetLastError=true)] static extern bool GetExitCodeProcess(IntPtr process,out uint code);
            [DllImport("kernel32.dll",SetLastError=true)] static extern bool TerminateProcess(IntPtr process,uint code);
            [DllImport("advapi32.dll",SetLastError=true)] static extern bool OpenProcessToken(IntPtr process,uint access,out IntPtr token);
            [DllImport("advapi32.dll",CharSet=CharSet.Unicode,SetLastError=true)] static extern bool ConvertStringSidToSid(string value,out IntPtr sid);
            [DllImport("advapi32.dll",SetLastError=true)] static extern bool CreateRestrictedToken(IntPtr existing,uint flags,uint disabledCount,[In]SidAttribute[] disabled,uint deletedCount,IntPtr deleted,uint restrictedCount,IntPtr restricted,out IntPtr token);
            [DllImport("advapi32.dll",CharSet=CharSet.Unicode,SetLastError=true)] static extern bool CreateProcessAsUserW(IntPtr token,string application,StringBuilder command,IntPtr processAttributes,IntPtr threadAttributes,bool inheritHandles,uint flags,IntPtr environment,string directory,ref StartupInfo startup,out ProcessInfo process);
            static void Check(bool success,string operation) { if(!success)throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error(),operation); }
            public static int Run(string executable,string arguments,string directory) {
              IntPtr token=IntPtr.Zero,restricted=IntPtr.Zero,adminSid=IntPtr.Zero; ProcessInfo process=new ProcessInfo();
              try {
                Check(OpenProcessToken(GetCurrentProcess(),0xF01FF,out token),"Open own QA token");
                Check(ConvertStringSidToSid("S-1-5-32-544",out adminSid),"Resolve Administrators SID");
                // Deny the Administrators group and remove all removable privileges.
                // No account, UAC, Defender, SmartScreen or security-policy settings change.
                Check(CreateRestrictedToken(token,1,1,new[]{new SidAttribute{Sid=adminSid}},0,IntPtr.Zero,0,IntPtr.Zero,out restricted),"Create standard-privilege QA token");
                StartupInfo startup=new StartupInfo();startup.cb=Marshal.SizeOf(typeof(StartupInfo));startup.desktop="winsta0\\default";
                Check(CreateProcessAsUserW(restricted,executable,new StringBuilder("\""+executable+"\" "+arguments),IntPtr.Zero,IntPtr.Zero,false,0x08000000,IntPtr.Zero,directory,ref startup,out process),"Start standard-privilege QA process");
                if(WaitForSingleObject(process.process,240000)!=0) { TerminateProcess(process.process,1460);throw new TimeoutException("Standard-privilege test timed out"); }
                uint exit;Check(GetExitCodeProcess(process.process,out exit),"Read QA exit code");return unchecked((int)exit);
              } finally {
                if(process.thread!=IntPtr.Zero)CloseHandle(process.thread);if(process.process!=IntPtr.Zero)CloseHandle(process.process);
                if(restricted!=IntPtr.Zero)CloseHandle(restricted);if(token!=IntPtr.Zero)CloseHandle(token);if(adminSid!=IntPtr.Zero)LocalFree(adminSid);
              }
            }
          }
          '@
          Add-Type -TypeDefinition $runner
          $exe=(Get-Process -Id $PID).Path
          $arguments="-NoProfile -File `"$dir\standard-user.ps1`" -Installer `"$dir\PoxeySetup.exe`" -OutputDirectory `"$dir`""
          try {$code=[PoxeyRestrictedRunner]::Run($exe,$arguments,$dir)}
          finally {Get-Content "$dir\standard-user-progress.json" -ErrorAction SilentlyContinue|Write-Host;Get-Content "$dir\standard-user-result.json" -ErrorAction SilentlyContinue|Write-Host}
          if($code -ne 0){throw "Standard-privilege verification failed: $code"}
      - name: Retain standard-privilege results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poxey-standard-user-${{ github.run_number }}
          path: ${{ runner.temp }}/Poxey-Standard-QA/*.json
          retention-days: 7
          if-no-files-found: warn
